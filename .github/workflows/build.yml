name: Build Flet APK

on:
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build-apk:
    runs-on: ubuntu-latest # Чистый Linux: никаких проблем с SSL и Windows!
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Build APK
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarCalculator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
