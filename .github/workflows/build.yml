name: Build Flet APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Java, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.3 flet-cli

      - name: Build APK (auto-accept prompts)
        run: |
          # Принудительно отвечаем "y" на все вопросы
          echo "y" | flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarCalculator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
